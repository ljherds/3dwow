<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Hand Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        
        /* Main visual canvas */
        #three-canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        /* Debug Skeleton Canvas (z-index 2) */
        #debug-canvas { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 2; 
            pointer-events: none;
            opacity: 0.6; /* Semi-transparent skeleton */
        }

        /* UI Overlay (z-index 3) */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.6);
            color: #0f0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            max-width: 250px;
            border: 1px solid #0f0;
            font-size: 12px;
            pointer-events: auto;
        }

        /* Start Button Screen */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        #start-btn {
            background: #a855f7;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            margin-top: 20px;
            cursor: pointer;
        }

        /* Hidden Video Element (Must exist for MediaPipe) */
        #input-video {
            position: absolute;
            top: 0; left: 0;
            width: 1px; height: 1px;
            opacity: 0;
            z-index: -1;
        }
    </style>
</head>
<body>

<div id="start-screen">
    <h1>Particle Gestures</h1>
    <p style="color: #aaa; padding: 0 20px;">Use good lighting.<br>You must see the RED SKELETON on your hand.</p>
    <button id="start-btn">Start Camera</button>
</div>

<video id="input-video" playsinline webkit-playsinline muted autoplay></video>

<canvas id="three-canvas"></canvas>
<canvas id="debug-canvas"></canvas>

<div id="ui-layer">
    <div class="info-box">
        <b style="color: white; font-size: 14px;">STATUS:</b> <span id="status-text">Waiting...</span><br>
        <div style="margin-top:5px; color: #aaa;">
            Fingers Up: <span id="fingers-debug" style="color:#fff">None</span>
        </div>
    </div>
    <div class="info-box" style="color: white; border-color: #a855f7;">
        ✌️ Peace = I LIKE YOU<br>
        🤘 Rock = Heart<br>
        ✋ High 5 = Birthday<br>
        🫳 C-Shape = Bouquet
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
    import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

    // --- DOM Elements ---
    const videoElement = document.getElementById('input-video');
    const debugCanvas = document.getElementById('debug-canvas');
    const debugCtx = debugCanvas.getContext('2d');
    const statusText = document.getElementById('status-text');
    const fingersDebug = document.getElementById('fingers-debug');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');

    // --- Configuration ---
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry/i.test(navigator.userAgent);
    const PARTICLE_COUNT = isMobile ? 12000 : 25000; // Lower count for mobile FPS
    
    // --- State ---
    let handResults = null;
    let currentShape = 'Scattered';
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let targetColors = new Float32Array(PARTICLE_COUNT * 3);
    let geometry, particles, scene, camera, renderer;
    let loadedFont = null;
    let rotationY = 0;

    // --- 1. Initialization ---
    startBtn.addEventListener('click', async () => {
        startBtn.innerText = "Loading AI...";
        await initThreeJS();
        await loadAssets();
        await startCamera();
        startScreen.style.display = 'none';
        animate();
    });

    async function initThreeJS() {
        const canvas = document.getElementById('three-canvas');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            debugCanvas.width = window.innerWidth;
            debugCanvas.height = window.innerHeight;
        });
        
        // Sync debug canvas size initially
        debugCanvas.width = window.innerWidth;
        debugCanvas.height = window.innerHeight;

        // Init Particles
        geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        
        // Fill initial scattered positions
        for(let i=0; i<PARTICLE_COUNT; i++) {
            positions[i*3] = (Math.random()-0.5)*10;
            positions[i*3+1] = (Math.random()-0.5)*10;
            positions[i*3+2] = (Math.random()-0.5)*10;
            colors[i*3] = 0.6; colors[i*3+1] = 0.3; colors[i*3+2] = 0.9; // Purple tint
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: isMobile ? 0.08 : 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Initialize target arrays
        for(let i=0; i<PARTICLE_COUNT*3; i++) {
            targetPositions[i] = positions[i];
            targetColors[i] = colors[i];
        }
        
        setShape('Scattered');
    }

    // --- 2. Camera & MediaPipe Setup ---
    async function startCamera() {
        // Load MediaPipe script dynamically
        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js";
        document.head.appendChild(script);

        await new Promise(r => script.onload = r);

        const hands = new window.Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // 0 is FAST (Lite), 1 is Full. Mobile needs 0.
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onHandResults);

        // Native Camera Stream (Front Facing)
        // Note: We request a small resolution (480x640) for performance
        const constraints = {
            video: {
                facingMode: 'user',
                width: { ideal: 480 },
                height: { ideal: 640 }
            },
            audio: false
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = stream;
            videoElement.play();
            
            // Start Prediction Loop
            const cameraLoop = async () => {
                if (videoElement.readyState >= 2) {
                    await hands.send({image: videoElement});
                }
                requestAnimationFrame(cameraLoop);
            };
            cameraLoop();
            statusText.innerText = "Camera Active. Show Hand.";
        } catch (e) {
            alert("Camera Error: " + e.message);
        }
    }

    // --- 3. Gesture Logic (The Brains) ---
    function onHandResults(results) {
        // Clear Debug Canvas
        debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);

        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
            handResults = null;
            fingersDebug.innerText = "None";
            return;
        }

        const lm = results.multiHandLandmarks[0];
        handResults = lm;

        // Draw Skeleton (Red Lines)
        drawSkeleton(lm);

        // Check Fingers (Tip y vs PIP y)
        // Note: On video, y increases downwards. So Tip < PIP means finger is UP.
        const indexUp = lm[8].y < lm[6].y;
        const middleUp = lm[12].y < lm[10].y;
        const ringUp = lm[16].y < lm[14].y;
        const pinkyUp = lm[20].y < lm[18].y;

        // Thumb Logic: Check if thumb tip is to the side of the index finger base
        // (Works better than height check for open hand)
        const thumbTip = lm[4];
        const indexBase = lm[5];
        const pinkyTip = lm[20];
        
        // Is Thumb far from Pinky? (Spread hand)
        const handSpread = Math.hypot(thumbTip.x - pinkyTip.x, thumbTip.y - pinkyTip.y) > 0.3;
        
        // Debug Text
        let activeFingers = [];
        if(indexUp) activeFingers.push("Ind");
        if(middleUp) activeFingers.push("Mid");
        if(ringUp) activeFingers.push("Rng");
        if(pinkyUp) activeFingers.push("Pnk");
        fingersDebug.innerText = activeFingers.join(", ");

        // --- TRIGGER SHAPES ---

        // 1. High Five (Happy Birthday)
        // Relaxed logic: If 4 main fingers are up, count it. Thumb is optional.
        if (indexUp && middleUp && ringUp && pinkyUp) {
            setShape('Birthday');
        }
        // 2. Peace (Index + Middle only)
        else if (indexUp && middleUp && !ringUp && !pinkyUp) {
            setShape('Text'); // "I LIKE YOU"
        }
        // 3. Rock (Index + Pinky only)
        else if (indexUp && pinkyUp && !middleUp && !ringUp) {
            setShape('Heart');
        }
        // 4. C-Shape / Bouquet
        // If all fingers down but thumb and index are apart
        else if (!indexUp && !middleUp && !ringUp && !pinkyUp) {
            const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
            // Detect "C" shape or holding something
            if (pinchDist > 0.05 && pinchDist < 0.25) {
                setShape('Bouquet');
            } else {
                setShape('Scattered'); // Just a fist
            }
        }
        else {
            // Default state if hand is visible but no gesture match
             if(currentShape !== 'Scattered' && currentShape !== 'Bouquet') {
                 // Keep current shape for a split second to prevent flickering? 
                 // For now, simple scatter.
                 setShape('Scattered');
             }
        }
    }

    function drawSkeleton(lm) {
        debugCtx.save();
        debugCtx.strokeStyle = "red";
        debugCtx.lineWidth = 3;
        debugCtx.beginPath();
        
        // Helper to draw connection
        const connect = (i, j) => {
            const w = debugCanvas.width;
            const h = debugCanvas.height;
            // Mirror X because we are using front camera
            const x1 = (1 - lm[i].x) * w; 
            const y1 = lm[i].y * h;
            const x2 = (1 - lm[j].x) * w;
            const y2 = lm[j].y * h;
            debugCtx.moveTo(x1, y1);
            debugCtx.lineTo(x2, y2);
        };

        // Thumb
        connect(0, 1); connect(1, 2); connect(2, 3); connect(3, 4);
        // Index
        connect(0, 5); connect(5, 6); connect(6, 7); connect(7, 8);
        // Middle
        connect(0, 9); connect(9, 10); connect(10, 11); connect(11, 12);
        // Ring
        connect(0, 13); connect(13, 14); connect(14, 15); connect(15, 16);
        // Pinky
        connect(0, 17); connect(17, 18); connect(18, 19); connect(19, 20);
        // Palm Base
        connect(5, 9); connect(9, 13); connect(13, 17); connect(17, 0);

        debugCtx.stroke();
        debugCtx.restore();
    }

    // --- 4. Particle & Shape Logic ---

    function setShape(type) {
        if (currentShape === type) return;
        currentShape = type;
        statusText.innerText = type.toUpperCase();

        if (type === 'Scattered') {
            const color = new THREE.Color('#a855f7');
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const r = 4 + Math.random() * 5;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                targetPositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
                targetPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                targetPositions[i*3+2] = r * Math.cos(phi);
                targetColors[i*3] = color.r; targetColors[i*3+1] = color.g; targetColors[i*3+2] = color.b;
            }
        }
        else if (type === 'Text' && loadedFont) {
            // "I LIKE YOU"
            const points = getPointsFromText(["I", "LIKE", "YOU"]);
            const color = new THREE.Color('#a855f7');
            assignPoints(points, color);
        }
        else if (type === 'Birthday' && loadedFont) {
            // "HAPPY BIRTHDAY" + Fireworks
            const points = getPointsFromText(["HAPPY", "BIRTHDAY"]);
            // Fireworks Colors
            const palette = [new THREE.Color('#ff0000'), new THREE.Color('#00ff00'), new THREE.Color('#0000ff'), new THREE.Color('#ffff00')];
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const pt = points[i % points.length];
                targetPositions[i*3] = pt.x; targetPositions[i*3+1] = pt.y; targetPositions[i*3+2] = pt.z;
                const c = palette[Math.floor(Math.random()*palette.length)];
                targetColors[i*3] = c.r; targetColors[i*3+1] = c.g; targetColors[i*3+2] = c.b;
            }
        }
        else if (type === 'Heart') {
            const color = new THREE.Color('#ff0044');
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                const vol = Math.cbrt(Math.random());
                let x = 1.6 * Math.pow(Math.sin(t), 3);
                let y = 1.3 * Math.cos(t) - 0.5 * Math.cos(2*t) - 0.2 * Math.cos(3*t) - 0.1 * Math.cos(4*t);
                let z = (Math.random()-0.5)*1.5;
                const s = 1.8 * vol;
                targetPositions[i*3] = x*s; targetPositions[i*3+1] = y*s; targetPositions[i*3+2] = z*s;
                targetColors[i*3] = color.r + (Math.random()-0.5)*0.2;
                targetColors[i*3+1] = color.g + (Math.random()-0.5)*0.2;
                targetColors[i*3+2] = color.b + (Math.random()-0.5)*0.2;
            }
        }
        else if (type === 'Bouquet') {
            generateBouquet();
        }
    }

    function assignPoints(points, color) {
        for(let i=0; i<PARTICLE_COUNT; i++) {
            const pt = points[i % points.length];
            targetPositions[i*3] = pt.x; targetPositions[i*3+1] = pt.y; targetPositions[i*3+2] = pt.z;
            targetColors[i*3] = color.r; targetColors[i*3+1] = color.g; targetColors[i*3+2] = color.b;
        }
    }

    function getPointsFromText(lines) {
        const points = [];
        const countPerLine = Math.floor(PARTICLE_COUNT / lines.length);
        lines.forEach((text, idx) => {
            const yOffset = (1 - idx) * 1.5; // Simple stacking
            const geo = new TextGeometry(text, { font: loadedFont, size: 1.0, height: 0 });
            geo.center();
            const mesh = new THREE.Mesh(geo);
            const sampler = new MeshSurfaceSampler(mesh).build();
            const temp = new THREE.Vector3();
            for(let i=0; i<countPerLine; i++) {
                sampler.sample(temp);
                points.push({x: temp.x, y: temp.y + yOffset, z: temp.z});
            }
        });
        return points;
    }

    function generateBouquet() {
        const flowers = [{ x: 0, y: 1.5, z: 0 }, { x: -1.2, y: 0.5, z: 0.5 }, { x: 1.2, y: 0.5, z: 0.5 }];
        const red = new THREE.Color('#ff0055');
        const green = new THREE.Color('#2d6a4f');
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const isStem = Math.random() > 0.8; 
            const flower = flowers[Math.floor(Math.random() * flowers.length)];
            if (isStem) {
                const t = Math.random();
                targetPositions[i*3] = flower.x * (1-t); targetPositions[i*3+1] = flower.y - t * 4; targetPositions[i*3+2] = flower.z * (1-t);
                targetColors[i*3] = green.r; targetColors[i*3+1] = green.g; targetColors[i*3+2] = green.b;
            } else {
                const u = Math.random(); const v = Math.random();
                const r = 0.8 * Math.sqrt(u); const theta = 2 * Math.PI * v; const phi = Math.acos(2 * Math.random() - 1);
                targetPositions[i*3] = flower.x + r * Math.sin(phi) * Math.cos(theta);
                targetPositions[i*3+1] = flower.y + r * Math.sin(phi) * Math.sin(theta);
                targetPositions[i*3+2] = flower.z + r * Math.cos(phi);
                targetColors[i*3] = red.r; targetColors[i*3+1] = red.g; targetColors[i*3+2] = red.b;
            }
        }
    }

    async function loadAssets() {
        return new Promise(resolve => {
            const loader = new FontLoader();
            loader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (f) => {
                loadedFont = f;
                resolve();
            });
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        
        const pos = geometry.attributes.position.array;
        const col = geometry.attributes.color.array;
        
        // Heartbeat logic
        let scale = 1.0;
        if(currentShape === 'Heart') {
             scale = 1 + Math.pow(Math.sin(Date.now()*0.005), 8) * 0.2;
        }

        // Morphing
        for(let i=0; i<PARTICLE_COUNT*3; i++) {
            currentPositions[i] += (targetPositions[i] - currentPositions[i]) * 0.1;
            pos[i] = currentPositions[i] * scale;
            col[i] += (targetColors[i] - col[i]) * 0.05;
        }
        
        geometry.attributes.position.needsUpdate = true;
        geometry.attributes.color.needsUpdate = true;

        // Auto Rotation
        rotationY += 0.002;
        if(currentShape === 'Text' || currentShape === 'Birthday') {
            particles.rotation.y = THREE.MathUtils.lerp(particles.rotation.y, 0, 0.1);
        } else {
            particles.rotation.y = rotationY;
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
