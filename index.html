<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Particle Gestures (Front Cam)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            max-width: 300px;
        }
        
        .status-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: white;
            pointer-events: auto;
        }

        #gesture-status { font-weight: bold; color: #a855f7; font-size: 1.2em;}

        /* Start Screen */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            flex-direction: column;
            color: white;
        }
        
        #start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #a855f7;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
        }

        /* Camera Preview - Mirrored for Front Cam feel */
        #video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 100px; /* Small preview */
            height: 133px; 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #a855f7;
            z-index: 5;
            display: none; 
            background: #000;
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1); /* MIRROR THE VIDEO */
        }

        /* Switch Camera Button */
        #switch-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid white;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            cursor: pointer;
            z-index: 20;
            display: none; /* Hidden until started */
        }
    </style>
</head>
<body>

<div id="start-overlay">
    <div style="text-align:center">
        <h1>Particle Morphing</h1>
        <p>Tap below to start Front Camera</p>
    </div>
    <button id="start-btn">Start Experience</button>
</div>

<div id="ui-container">
    <div class="status-card">
        <h2 style="margin: 0 0 5px 0; font-size:14px; opacity: 0.7">Gesture Detected:</h2>
        <div id="gesture-status">Scattered</div>
        <div style="font-size: 11px; margin-top: 8px; color: #aaa; line-height: 1.4;">
            ✌️ Peace = Text<br>
            🤘 Rock = Heart (Beating)<br>
            🫳 C-Shape = Bouquet<br>
            ✋ High Five = Birthday
        </div>
    </div>
</div>

<div id="video-container">
    <video id="input-video" playsinline webkit-playsinline muted autoplay></video>
    <button id="switch-btn">↻</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
    }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { GUI } from 'lil-gui';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
    import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

    const videoElement = document.getElementById('input-video');
    const statusText = document.getElementById('gesture-status');
    const startBtn = document.getElementById('start-btn');
    const startOverlay = document.getElementById('start-overlay');
    const videoContainer = document.getElementById('video-container');
    const switchBtn = document.getElementById('switch-btn');

    // Mobile Detection
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const PARTICLE_COUNT = isMobile ? 15000 : 30000; 

    let scene, camera, renderer, particles, geometry;
    let loadedFont = null;
    let hands; // MediaPipe Hands instance
    let cameraStream = null;
    let usingFrontCam = true; // Default to front

    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let targetColors = new Float32Array(PARTICLE_COUNT * 3); 
    
    let handOpenFactor = 0;
    let currentShapeState = 'Scattered';
    let gestureHoldTimer = 0; 
    let currentRotationY = 0;

    const params = {
        color: '#a855f7', 
        particleSize: isMobile ? 0.06 : 0.04, 
        morphSpeed: 0.08,
        expansion: 1.5,
        rotationBaseSpeed: 0.001
    };

    // --- Init Sequence ---
    startBtn.addEventListener('click', async () => {
        startOverlay.style.display = 'none';
        videoContainer.style.display = 'block';
        switchBtn.style.display = 'block';
        await initThreeJS();
        await setupTracking(); // Starts Camera
    });

    switchBtn.addEventListener('click', () => {
        usingFrontCam = !usingFrontCam;
        startCamera(); // Restart with new facing mode
    });

    async function initThreeJS() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10; 

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: params.particleSize,
            vertexColors: true,
            transparent: true,
            opacity: 0.9, 
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);

        const baseColor = new THREE.Color(params.color);
        for(let i=0; i<PARTICLE_COUNT; i++) {
            colors[i*3] = baseColor.r; colors[i*3+1] = baseColor.g; colors[i*3+2] = baseColor.b;
            targetColors[i*3] = baseColor.r; targetColors[i*3+1] = baseColor.g; targetColors[i*3+2] = baseColor.b;
        }

        generateShape('Scattered');
        for(let i=0; i < PARTICLE_COUNT * 3; i++) currentPositions[i] = targetPositions[i];

        const gui = new GUI({ width: 200 });
        if(isMobile) gui.close();
        
        gui.addColor(params, 'color').name('Color').onChange(() => {
            if (currentShapeState !== 'Bouquet' && currentShapeState !== 'Birthday') {
                updateColors(params.color);
            }
        });

        // Start Animation Loop
        animate();
    }

    // --- Native Camera Setup (No CameraUtils) ---
    async function startCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            audio: false,
            video: {
                facingMode: usingFrontCam ? 'user' : 'environment',
                width: { ideal: isMobile ? 480 : 640 },
                height: { ideal: isMobile ? 640 : 480 }
            }
        };

        try {
            cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = cameraStream;
            
            // Wait for video to load data before starting prediction loop
            videoElement.onloadeddata = () => {
                videoElement.play();
                predictLoop();
            };
        } catch (err) {
            console.error("Camera Error:", err);
            alert("Camera failed to start. Please allow permissions.");
        }
    }

    async function predictLoop() {
        if (!videoElement.paused && !videoElement.ended) {
            await hands.send({image: videoElement});
        }
        // Throttled loop for mobile performance (every 30ms approx)
        setTimeout(() => requestAnimationFrame(predictLoop), 30);
    }

    async function setupTracking() {
        hands = new window.Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ 
            maxNumHands: 1, 
            modelComplexity: isMobile ? 0 : 1, 
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onHandResults);
        
        // Start the native camera
        await startCamera();
    }

    function onHandResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const lm = results.multiHandLandmarks[0];
            gestureHoldTimer = 10; 

            const isIndexUp = lm[8].y < lm[6].y;
            const isMiddleUp = lm[12].y < lm[10].y;
            const isRingUp = lm[16].y < lm[14].y;
            const isPinkyUp = lm[20].y < lm[18].y;
            const isThumbUp = lm[4].y < lm[3].y;
            const thumbTip = lm[4];
            const indexTip = lm[8];
            const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);

            // 1. High Five = Birthday
            if (isIndexUp && isMiddleUp && isRingUp && isPinkyUp && isThumbUp) {
                generateShape('Birthday');
            }
            // 2. Peace = Text
            else if (isIndexUp && isMiddleUp && !isRingUp && !isPinkyUp) {
                generateShape('Text'); 
            } 
            // 3. Rock = Heart
            else if (isIndexUp && isPinkyUp && !isMiddleUp && !isRingUp) {
                generateShape('Heart'); 
            } 
            // 4. C-Shape = Bouquet
            else if (!isIndexUp && !isPinkyUp && pinchDist > 0.05 && pinchDist < 0.25) {
                generateShape('Bouquet');
            }
            else {
                 if (!isIndexUp && !isMiddleUp && !isRingUp && !isPinkyUp && pinchDist > 0.3) {
                     if(currentShapeState !== 'Scattered') generateShape('Scattered');
                 }
            }
            
            const dist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
            handOpenFactor = THREE.MathUtils.clamp((dist - 0.05) / 0.2, 0, 1);
        } else {
            if (gestureHoldTimer > 0) gestureHoldTimer--;
            else {
                handOpenFactor = 0;
                if (currentShapeState !== 'Scattered') generateShape('Scattered');
            }
        }
    }

    // --- Shape & Animation Logic (Same as before) ---
    function getTextPoints(text, font, yOffset, count) {
        const textGeo = new TextGeometry(text, {
            font: font, size: isMobile ? 1.0 : 1.3, 
            height: 0, curveSegments: 3, bevelEnabled: false
        });
        textGeo.center();
        const mesh = new THREE.Mesh(textGeo, new THREE.MeshBasicMaterial());
        const sampler = new MeshSurfaceSampler(mesh).build();
        const tempPosition = new THREE.Vector3();
        const points = [];
        for (let i = 0; i < count; i++) {
            sampler.sample(tempPosition);
            points.push({ x: tempPosition.x, y: tempPosition.y + yOffset, z: tempPosition.z });
        }
        textGeo.dispose();
        return points;
    }

    function generateShape(type) {
        if (currentShapeState === type && type !== 'Scattered') return; 
        
        if (type === 'Text' || type === 'Birthday') {
            currentRotationY = 0;
            particles.rotation.y = 0;
        }

        currentShapeState = type;
        statusText.innerText = type;

        if (type === 'Scattered') {
             updateColors(params.color); 
             for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const r = 2 + Math.random() * 8; 
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                targetPositions[i3] = r * Math.sin(phi) * Math.cos(theta);
                targetPositions[i3+1] = r * Math.sin(phi) * Math.sin(theta);
                targetPositions[i3+2] = r * Math.cos(phi);
             }
        }
        else if (type === 'Text' && loadedFont) {
            updateColors(params.color);
            const particlesPerLine = Math.floor(PARTICLE_COUNT / 3);
            const line1 = getTextPoints("I", loadedFont, 1.8, particlesPerLine);
            const line2 = getTextPoints("LIKE", loadedFont, 0, particlesPerLine);
            const line3 = getTextPoints("YOU", loadedFont, -1.8, particlesPerLine);
            const allPoints = [...line1, ...line2, ...line3];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const pt = allPoints[i % allPoints.length];
                targetPositions[i3] = pt.x; targetPositions[i3+1] = pt.y; targetPositions[i3+2] = pt.z;
            }
        }
        else if (type === 'Heart') {
            const red = new THREE.Color('#ff0040');
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const vol = Math.cbrt(Math.random()); 
                const t = Math.random() * Math.PI * 2;
                let x = 1.6 * Math.pow(Math.sin(t), 3);
                let y = 1.3 * Math.cos(t) - 0.5 * Math.cos(2*t) - 0.2 * Math.cos(3*t) - 0.1 * Math.cos(4*t);
                let z = (Math.random() - 0.5) * 1.0; 
                const s = 1.8 * vol; 
                targetPositions[i3] = x * s; targetPositions[i3+1] = y * s; targetPositions[i3+2] = z * s;
                targetColors[i3] = red.r + (Math.random()-0.5)*0.2;
                targetColors[i3+1] = red.g + (Math.random()-0.5)*0.2;
                targetColors[i3+2] = red.b + (Math.random()-0.5)*0.2;
            }
        }
        else if (type === 'Bouquet') {
            const flowers = [{ x: 0, y: 1.5, z: 0 }, { x: -1.2, y: 0.5, z: 0.5 }, { x: 1.2, y: 0.5, z: 0.5 }];
            const redColor = new THREE.Color('#ff0055');
            const pinkColor = new THREE.Color('#ff99aa');
            const greenColor = new THREE.Color('#2d6a4f');
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const isStem = Math.random() > 0.85; 
                const flower = flowers[Math.floor(Math.random() * flowers.length)];
                if (isStem) {
                    const t = Math.random();
                    targetPositions[i3] = flower.x * (1-t); targetPositions[i3+1] = flower.y - t * 4; targetPositions[i3+2] = flower.z * (1-t);
                    targetColors[i3] = greenColor.r + (Math.random()-0.5)*0.2;
                    targetColors[i3+1] = greenColor.g + (Math.random()-0.5)*0.2;
                    targetColors[i3+2] = greenColor.b + (Math.random()-0.5)*0.2;
                } else {
                    const u = Math.random(); const v = Math.random();
                    const r = 0.8 * Math.sqrt(u); const theta = 2 * Math.PI * v; const phi = Math.acos(2 * Math.random() - 1);
                    const wobble = 1 + 0.2 * Math.sin(5*theta);
                    targetPositions[i3] = flower.x + (r * Math.sin(phi) * Math.cos(theta)) * wobble;
                    targetPositions[i3+1] = flower.y + (r * Math.sin(phi) * Math.sin(theta)) * wobble;
                    targetPositions[i3+2] = flower.z + (r * Math.cos(phi)) * wobble;
                    const c = Math.random() > 0.5 ? redColor : pinkColor;
                    targetColors[i3] = c.r; targetColors[i3+1] = c.g; targetColors[i3+2] = c.b;
                }
            }
        }
        else if (type === 'Birthday' && loadedFont) {
            const particlesPerLine = Math.floor(PARTICLE_COUNT / 2);
            const line1 = getTextPoints("HAPPY", loadedFont, 1.2, particlesPerLine);
            const line2 = getTextPoints("BIRTHDAY", loadedFont, -1.2, particlesPerLine);
            const allPoints = [...line1, ...line2];
            const fireworkColors = [
                new THREE.Color('#ff0000'), new THREE.Color('#ffd700'), 
                new THREE.Color('#00ffff'), new THREE.Color('#ff00ff'), new THREE.Color('#00ff00')
            ];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const pt = allPoints[i % allPoints.length];
                targetPositions[i3] = pt.x; targetPositions[i3+1] = pt.y; targetPositions[i3+2] = pt.z;
                const c = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
                targetColors[i3] = c.r; targetColors[i3+1] = c.g; targetColors[i3+2] = c.b;
            }
        }
    }

    function updateColors(hexColor) {
        const color = new THREE.Color(hexColor);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            targetColors[i*3] = color.r + (Math.random()-0.5)*0.1;
            targetColors[i*3+1] = color.g + (Math.random()-0.5)*0.1;
            targetColors[i*3+2] = color.b + (Math.random()-0.5)*0.1;
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        const positions = geometry.attributes.position.array;
        const colors = geometry.attributes.color.array;
        
        let scale = 1 + (handOpenFactor * params.expansion);
        let beatScale = 1;

        if (currentShapeState === 'Heart') {
            const time = Date.now() * 0.005; 
            beatScale = 1 + Math.pow(Math.sin(time), 6) * 0.15; 
        }

        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
            currentPositions[i] += (targetPositions[i] - currentPositions[i]) * params.morphSpeed;
            positions[i] = currentPositions[i] * scale * beatScale;
            colors[i] += (targetColors[i] - colors[i]) * 0.05;
        }

        geometry.attributes.position.needsUpdate = true;
        geometry.attributes.color.needsUpdate = true;
        
        if (currentShapeState === 'Heart' || currentShapeState === 'Bouquet') {
            currentRotationY += 0.015; 
            particles.rotation.y = currentRotationY;
        } else if (currentShapeState === 'Text' || currentShapeState === 'Birthday') {
            particles.rotation.y += (0 - particles.rotation.y) * 0.1;
            currentRotationY = particles.rotation.y; 
        } else {
            currentRotationY += params.rotationBaseSpeed;
            particles.rotation.y = currentRotationY;
        }
        particles.rotation.x = (handOpenFactor - 0.5) * 0.2;
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function loadScript(src) {
        return new Promise(resolve => {
            const script = document.createElement('script');
            script.src = src; script.onload = resolve;
            document.head.appendChild(script);
        });
    }

    const fontLoader = new FontLoader();
    const fontPromise = new Promise(resolve => {
        fontLoader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
            loadedFont = font;
            resolve();
        });
    });

    Promise.all([
        loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js'),
        fontPromise
    ]).then(() => {
        // Ready
        console.log("Ready");
    });
</script>
</body>
</html>
